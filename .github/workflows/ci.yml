# No secrets or model APIs; this workflow runs the offline pytest suite only.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Official v5.0.0 release: https://github.com/actions/checkout/releases/tag/v5.0.0
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Official v6.0.0 release: https://github.com/actions/setup-python/releases/tag/v6.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider tests_agent
